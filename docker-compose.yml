services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailroom}
      POSTGRES_DB: mailroom
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    image: ghcr.io/shortink/mailroom
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # PORT in .env picks the host port below. The server inside always
      # listens on 3000, or that mapping points at nothing.
      PORT: 3000
      # The bundled Postgres unless .env names another one.
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-mailroom}@db:5432/mailroom}
      STORAGE_DRIVER: fs
      FS_STORAGE_PATH: /data/attachments
      APP_URL: ${APP_URL:-http://localhost:3000}
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - attachments:/data/attachments

volumes:
  dbdata:
  attachments:
